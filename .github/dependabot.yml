version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      all-npm:
        patterns: ["*"]
    open-pull-requests-limit: 3
    ignore:
      # @astrojs/check supports TypeScript ^5 || ^6 only; revisit when it supports 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
